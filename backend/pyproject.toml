[project]
name = "laborlink-backend"
version = "0.1.0"
description = "LaborLink backend API (Phase 1: job intake, work orders, FairRate pricing)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/File() in argument defaults is idiomatic
